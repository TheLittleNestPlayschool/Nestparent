name: My World background cleanup
on:
  push:
    paths:
      - '.github/workflows/my_world_cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Remove connected dark background
        run: |
          python - <<'PY'
          import re,base64,io
          from collections import deque
          from PIL import Image, ImageFilter
          src='assets/awards/my_world_source.svg'
          out='assets/awards/my_world.svg'
          text=open(src,encoding='utf-8').read()
          m=re.search(r'data:image/webp;base64,([^\"]+)',text)
          if not m: raise SystemExit('Embedded WebP not found')
          im=Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGBA')
          w,h=im.size; px=im.load()
          def dark(x,y):
              r,g,b,a=px[x,y]; lum=.2126*r+.7152*g+.0722*b
              return a>0 and lum<72
          seen=bytearray(w*h); q=deque()
          for x in range(w):
              if dark(x,0): q.append((x,0))
              if dark(x,h-1): q.append((x,h-1))
          for y in range(h):
              if dark(0,y): q.append((0,y))
              if dark(w-1,y): q.append((w-1,y))
          while q:
              x,y=q.popleft(); i=y*w+x
              if seen[i] or not dark(x,y): continue
              seen[i]=1; r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0)
              if x: q.append((x-1,y))
              if x+1<w: q.append((x+1,y))
              if y: q.append((x,y-1))
              if y+1<h: q.append((x,y+1))
          alpha=im.getchannel('A'); softened=alpha.filter(ImageFilter.GaussianBlur(0.7))
          ap=alpha.load(); sp=softened.load()
          for y in range(h):
              for x in range(w):
                  if ap[x,y]==0: sp[x,y]=0
                  elif sp[x,y]>=ap[x,y]: sp[x,y]=ap[x,y]
          im.putalpha(softened)
          buf=io.BytesIO(); im.save(buf,'PNG',optimize=True)
          data=base64.b64encode(buf.getvalue()).decode()
          open(out,'w',encoding='utf-8').write(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {w} {h}" width="{w}" height="{h}" role="img" aria-label="My World award graphic"><image width="{w}" height="{h}" href="data:image/png;base64,{data}"/></svg>')
          PY
      - name: Commit cleaned award
        run: |
          git config user.name 'TheLittleNestPlayschool'
          git config user.email 'admin@thelittle-nest.com'
          git add assets/awards/my_world.svg
          git commit -m 'Remove black background from My World award' || exit 0
          git push
