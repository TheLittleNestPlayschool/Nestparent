<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#eef4f1"
  />

  <title>
    The Little Nest — Parent Experience Prototype
  </title>

  <link
    rel="stylesheet"
    href="index.css"
  />
</head>

<body>

  <main
    class="app"
    id="app"
  >

    <!-- Moving atmosphere -->

    <div
      class="time-atmosphere"
      aria-hidden="true"
    >
      <span class="color-field field-a"></span>
      <span class="color-field field-b"></span>
      <span class="color-field field-c"></span>
      <span class="color-field field-d"></span>
      <span class="light-drift"></span>
    </div>

    <div class="grain"></div>


    <!-- ==========================================
         ARRIVAL
         ========================================== -->

    <section
      class="arrival-screen"
      id="arrivalScreen"
      aria-label="Welcome"
    >

      <div class="arrival-copy">

        <span class="arrival-eyebrow">
          The Little Nest
        </span>

        <h1
          class="arrival-greeting"
          id="arrivalGreeting"
        >
          Good morning, Mom
        </h1>

        <p
          class="arrival-message"
          id="arrivalMessage"
        >
          Mia's morning is waiting for you.
        </p>

      </div>

    </section>


    <!-- ==========================================
         NORMAL APP HEADER
         ========================================== -->

    <header
      class="topbar app-content"
      id="topbar"
    >

      <div class="identity">

        <span class="eyebrow">
          The Little Nest
        </span>

        <span
          class="hello"
          id="timeGreeting"
        >
          Good morning, Mom
        </span>

        <span
          class="subhello"
          id="timeMessage"
        >
          Mia's morning is waiting for you.
        </span>

      </div>

      <button
        class="profile"
        aria-label="Profile"
      >
        <span class="profile-dot"></span>
      </button>

    </header>


    <!-- ==========================================
         EXPERIENCE
         ========================================== -->

    <section
      class="experience-shell app-content"
      id="experienceShell"
    >

      <div
        class="intro intro-quiet"
        aria-hidden="true"
      ></div>

      <div class="carousel-wrap">

        <div
          class="carousel"
          id="carousel"
        ></div>

      </div>

    </section>


    <!-- Swipe hint -->

    <div
      class="hint app-content"
      id="hint"
    >

      <span class="hint-line"></span>

      <span>
        swipe to wander
      </span>

      <span class="hint-line"></span>

    </div>


    <!-- Overlay -->

    <div
      class="wash"
      id="wash"
    ></div>


    <!-- Navigation -->

    <nav
      class="nav-panel app-content"
      id="navPanel"
      aria-label="Parent navigation"
    >

      <button class="nav-item active">

        <span class="nav-icon">
          ⌂
        </span>

        <span class="nav-text">
          Nest
        </span>

      </button>


      <button class="nav-item">

        <span class="nav-icon">
          ♡
        </span>

        <span class="nav-text">
          Memories
        </span>

      </button>


      <button class="nav-item">

        <span class="nav-icon">
          ✦
        </span>

        <span class="nav-text">
          Journey
        </span>

      </button>


      <button class="nav-item">

        <span class="nav-icon">
          •••
        </span>

        <span class="nav-text">
          More
        </span>

      </button>

    </nav>


    <button
      class="nav-orb app-content"
      id="navOrb"
      aria-label="Open navigation"
    ></button>


    <!-- ==========================================
         DEEP SHEET
         ========================================== -->

    <section
      class="deep-sheet"
      id="deepSheet"
      aria-hidden="true"
    >

      <div class="sheet-handle"></div>

      <div class="sheet-kicker">
        Inside this moment
      </div>

      <h2
        class="sheet-title"
        id="sheetTitle"
      >
        What Mia was exploring
      </h2>

      <p
        class="sheet-copy"
        id="sheetCopy"
      ></p>

      <div
        class="learning-list"
        id="learningList"
      ></div>

      <button
        class="sheet-close"
        id="sheetClose"
      >
        Back to the moment
      </button>

    </section>

  </main>


  <script src="index.js"></script>

</body>
</html>
