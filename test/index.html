<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#eef4f1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NestHome Test" />
  <title>The Little Nest — NestHome Test</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1" />
  <link rel="stylesheet" href="../index.css?v=14" />
  <link rel="stylesheet" href="./test.css?v=3" />
</head>
<body>
  <div class="nh-test-banner">NestHome Testing</div>
  <main class="app" id="app">
    <div class="time-atmosphere" aria-hidden="true"><span class="color-field field-a"></span><span class="color-field field-b"></span><span class="color-field field-c"></span><span class="color-field field-d"></span><span class="light-drift"></span></div><div class="grain"></div>
    <section class="parent-login" id="parentLogin" aria-label="Parent login"><div class="parent-login-card"><div class="parent-login-brand"><div class="parent-login-nest" aria-hidden="true"><span class="parent-login-egg"></span><span class="parent-login-nest-line nest-line-one"></span><span class="parent-login-nest-line nest-line-two"></span><span class="parent-login-nest-line nest-line-three"></span></div><span class="parent-login-eyebrow">The Little Nest</span><span class="parent-login-subtitle">Where Little Success Stories Begin</span></div><div class="parent-login-fields"><input type="email" id="loginEmail" class="parent-login-input" placeholder="Email" autocomplete="email" /><input type="password" id="loginPassword" class="parent-login-input" placeholder="Password" autocomplete="current-password" /></div><div class="parent-login-action"><span class="parent-login-action-text">Enter The Nest</span><button type="button" class="parent-login-button" id="loginButton" aria-label="Enter The Nest">→</button></div><div class="parent-login-error" id="loginError" role="alert"></div></div></section>
    <div class="parent-experience" id="parentExperience"><div class="nh-turn"><div><strong>Turn your phone sideways</strong>Your child's latest journey is made to explore in landscape.</div></div><section class="nh-journey" aria-label="Latest session journey"><div class="nh-journey-rail" id="journeyRail"><section class="nh-journey-space"><span class="nh-journey-mark">Beginning</span></section><section class="nh-journey-space"><span class="nh-journey-mark">Journey space</span></section><section class="nh-journey-space"><span class="nh-journey-mark">Journey space</span></section><section class="nh-journey-space"><span class="nh-journey-mark">Journey space</span></section></div></section></div>
  </main>
  <script type="module" src="./test.js?v=2"></script>
</body>
</html>
